[profile.default]
src = "contracts"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = false
bytecode_hash = "none"
evm_version = "cancun"

# `forge test` reads nft/course-nft.svg to prove the on-chain copy has not drifted,
# and allowlist/generated/*.json to test against proofs from the real JS generator.
fs_permissions = [
    {access = "read", path = "./nft"},
    {access = "read", path = "./allowlist/generated"},
    {access = "read", path = "./deployments"},
]

remappings = [
    "forge-std/=lib/forge-std/src/",
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
]

[fmt]
line_length = 110
tab_width = 4
bracket_spacing = false
int_types = "long"

[etherscan]
sepolia = {key = "${ETHERSCAN_API_KEY}", chain = 11155111}
