[profile.default]
src = "contracts"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = false
bytecode_hash = "none"
evm_version = "cancun"

# `forge test` reads nft/course-nft-onchain.webp to prove the on-chain copy has not
# drifted, and allowlist/generated/*.json to test against proofs from the real JS
# generator. It reads those named files only; other files in nft/ are ignored.
fs_permissions = [
    {access = "read", path = "./nft"},
    {access = "read", path = "./allowlist/generated"},
    {access = "read", path = "./deployments"},
]

remappings = [
    "forge-std/=lib/forge-std/src/",
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
]

[fmt]
line_length = 110
tab_width = 4
bracket_spacing = false
int_types = "long"

# Scripts pass `--rpc-url sepolia`, so the endpoint, which usually embeds an API key,
# is read from the environment and never appears on a command line.
[rpc_endpoints]
sepolia = "${SEPOLIA_RPC_URL}"

[etherscan]
sepolia = {key = "${ETHERSCAN_API_KEY}", chain = 11155111}
