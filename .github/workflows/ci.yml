# Tests and build only. This workflow deliberately does NOT deploy.
#
# Publishing to gh-pages happens from a developer machine via
# `scripts/publish-pages.sh`. See "GitHub Pages and CI" in the README for why a
# workflow that pushes gh-pages with GITHUB_TOKEN is not what you want here.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  contracts:
    name: Foundry tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install allowlist tooling
        run: npm install

      - name: Regenerate the example Merkle fixture
        run: npm run merkle -- --example

      - name: Fail if the fixture is out of date
        run: git diff --exit-code allowlist/generated/example-tree.json

      - name: Check the embedded artwork matches nft/course-nft-onchain.webp
        run: |
          npm run embed:image
          git diff --exit-code contracts/CourseArtwork.sol

      - name: Run tests
        run: forge test -vv

      - name: Report contract size
        run: forge build --sizes

  web:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install allowlist tooling
        run: npm install

      - name: Generate proofs
        run: npm run merkle -- --example

      - name: Export the card layers the page draws with
        run: |
          npm --prefix generator ci
          npm --prefix generator run prepare-assets
          npm --prefix generator run export-web

      - name: Build the claim page
        run: npm --prefix web ci && npm --prefix web run build

      - name: Fail if the build cannot draw cards
        run: test -f web/dist/nft/index.json

  generator:
    name: NFT generator
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: generator
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Fail if the committed overlays are out of date
        run: |
          npm run build-overlays
          git diff --exit-code assets/overlays

      - name: Prepare assets
        run: npm run prepare-assets

      - name: Validate assets
        run: npm run validate-assets

      - name: Test, including pixel checks on real renders
        run: npm test

      - name: Rarity simulation
        run: npm run rarity -- --count 10000

      - name: Render a few previews
        run: npm run preview -- --count 3
